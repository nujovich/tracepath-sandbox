name: tracepath-comment

# Spike: posts .github/tracepath/comment.md to the PR as github-actions[bot],
# to test how CodeRabbit reacts to a bot-authored provenance comment.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/tracepath/comment.md"

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post provenance comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file .github/tracepath/comment.md
